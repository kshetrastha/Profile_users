<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect with Wonge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#8A520A}a:hover{color:#5E3705}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 24px}
.disp{font-family:'Anton','Impact',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;line-height:0.98;margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn-gold{background:#E9A23B;color:#111111}.btn-gold:hover{background:#F2B65A;color:#111111}
.btn-dark{background:#111111;color:#FFFFFF}.btn-dark:hover{background:#2A2825;color:#FFFFFF}
.navlink{color:#D9D3C7;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:0.1em}.navlink:hover{color:#E9A23B}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea{min-height:48px;border-radius:10px;border:1.5px solid #CFC6B6;background:#FFFFFF;padding:0 14px;font:inherit;font-weight:400;font-size:15px;color:#111111}
.field textarea{padding:12px 14px;min-height:110px}
</style>
</head>
<body>
<div id="app"></div>
<template id="page">


<div style="width: 100%; background: #F5F1EA; color: #111111; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.55">

<header style="background: #111111; border-bottom: 1px solid #2E2C28">
  <div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px">
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF">
      <span style="width: 44px; height: 44px; border-radius: 10px; background: #E9A23B; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M2 20 L9 7 L13 13 L16 9 L22 20 Z"></path></svg></span>
      <span style="display: flex; flex-direction: column; line-height: 1"><span class="disp" style="font-size: 26px; color: #FFFFFF">WongEX<span style="color: #E9A23B">4U</span></span><span style="font-size: 11px; letter-spacing: 0.18em; color: #B9B3A8; margin-top: 4px">WONGE SHERPA</span></span>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center">
      <a class="navlink" href="index.html">HOME</a>
      <a class="navlink" href="about.html">ABOUT</a>
      <a class="navlink" href="index.html">ECOSYSTEM</a>
      <a class="navlink" href="free-training.html">LEARN</a>
      <a class="navlink" href="stories.html">STORIES</a>
      <a class="navlink" href="media.html">MEDIA</a>
      <a class="navlink" href="impact.html">IMPACT</a>
      <a class="navlink" href="connect.html" style="color: #E9A23B">CONNECT</a>
    </nav>
    <a class="btn btn-gold" href="#whatsapp">WhatsApp Wonge →</a>
  </div>
</header>

<!-- HERO -->
<section style="background: #111111; color: #FFFFFF; padding: 80px 0 72px">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 20px">
    <p class="eyebrow" style="color: #E9A23B">Connect with Wonge</p>
    <h1 class="disp" style="font-size: clamp(56px, 8vw, 116px); color: #FFFFFF">Ready to build your<br><span style="color: #E9A23B">next chapter?</span></h1>
    <p style="margin: 0; max-width: 620px; font-size: 18px; color: #D9D3C7">Tell us what you're looking for and we'll point you to the right place.</p>
  </div>
</section>

<!-- INTENT PICKER -->
<section style="padding: 72px 0 96px">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
    <div role="group" aria-label="What would you like to do?" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px">
      <sc-for list="{{intents}}" as="i" hint-placeholder-count="6">
        <button type="button" onClick="{{i.pick}}" aria-pressed="{{i.pressed}}" style="min-height: 64px; padding: 0 20px; border-radius: 16px; border: 2px solid #111111; background: {{i.bg}}; color: {{i.fg}}; font: inherit; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; text-align: left; cursor: pointer">{{i.label}}</button>
      </sc-for>
    </div>

    <div style="padding: 40px; border-radius: 28px; background: #FFFFFF; border: 1px solid #E3DCD0">
      <sc-if value="{{isRoute}}" hint-placeholder-val="{{ false }}">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; align-items: center">
          <img src="{{route.img}}" alt="" style="width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 18px; display: block">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <span class="eyebrow" style="color: #8A520A">{{route.eyebrow}}</span>
            <span class="disp" style="font-size: 44px">{{route.title}}</span>
            <p style="margin: 0; color: #3A3732">{{route.body}}</p>
            <a class="btn btn-dark" href="{{route.href}}" style="align-self: flex-start">{{route.cta}} →</a>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{formOpen}}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 16px">
            <span class="disp" style="font-size: 40px">{{form.title}}</span>
            <p style="margin: 0; color: #5A554D">{{form.sub}}</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
              <label class="field">Full name*<input type="text" required="required" autocomplete="name"></label>
              <label class="field">Email*<input type="email" required="required" autocomplete="email"></label>
              <label class="field">Mobile / WhatsApp<input type="tel" autocomplete="tel"></label>
              <label class="field">Country*<input type="text" required="required" autocomplete="country-name"></label>
            </div>
            <sc-if value="{{isIT}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
                <label class="field">Service needed<select><option>Website</option><option>Software / app</option><option>Payment solutions</option><option>Business automation</option><option>IT services</option><option>Other</option></select></label>
                <label class="field">Company name<input type="text" autocomplete="organization"></label>
              </div>
            </sc-if>
            <sc-if value="{{isSpeak}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
                <label class="field">Event name<input type="text"></label>
                <label class="field">Event date<input type="date"></label>
                <label class="field">Expected audience<select><option>Under 50</option><option>50–200</option><option>200–1,000</option><option>1,000+</option></select></label>
                <label class="field">Format<select><option>In person</option><option>Online</option><option>Podcast / interview</option></select></label>
              </div>
            </sc-if>
            <label class="field">Message<textarea></textarea></label>
            <p style="margin: 0; font-size: 12px; color: #5A554D">We use these details only to reply to this request. <a href="#privacy">Privacy Policy</a></p>
            <button type="submit" class="btn btn-dark" style="align-self: flex-start">{{form.cta}} →</button>
          </form>
        </sc-if>
        <sc-if value="{{formDone}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 12px; min-height: 260px; justify-content: center">
            <span class="disp" style="font-size: 40px">Message received</span>
            <p style="margin: 0; color: #5A554D">Thank you — Wonge or the right team member will get back to you.</p>
            <button type="button" onClick="{{again}}" style="align-self: flex-start; padding: 8px 0; border: none; background: none; font: inherit; font-size: 14px; text-decoration: underline; color: #5A554D; cursor: pointer">Send another message</button>
          </div>
        </sc-if>
      </sc-if>
    </div>
  </div>
</section>

<!-- WHATSAPP + SOCIAL -->
<section id="whatsapp" style="background: #E9A23B; padding: 88px 0">
  <div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h2 class="disp" style="font-size: clamp(48px, 7vw, 96px)">Prefer to chat?</h2>
      <a class="btn btn-dark" href="#whatsapp" style="align-self: flex-start; min-height: 64px; padding: 0 32px; font-size: 16px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path></svg>
        WhatsApp Wonge · [NUMBER]
      </a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <a href="#instagram" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #111111; color: #FFFFFF; font-weight: 700; text-decoration: none">Instagram</a>
      <a href="#tiktok" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #111111; color: #FFFFFF; font-weight: 700; text-decoration: none">TikTok</a>
      <a href="#youtube" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #111111; color: #FFFFFF; font-weight: 700; text-decoration: none">YouTube</a>
      <a href="#facebook" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #111111; color: #FFFFFF; font-weight: 700; text-decoration: none">Facebook</a>
      <a href="#x" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #111111; color: #FFFFFF; font-weight: 700; text-decoration: none">X</a>
      <a href="#linkedin" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #111111; color: #FFFFFF; font-weight: 700; text-decoration: none">LinkedIn</a>
    </div>
  </div>
</section>

<!-- PRIVACY SUMMARY -->
<section id="privacy" style="padding: 88px 0">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 24px">
    <h2 class="disp" style="font-size: clamp(36px, 4vw, 52px)">Your privacy, in plain words</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
      <div style="padding: 22px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3DCD0"><span style="display: block; font-weight: 800; margin-bottom: 6px">Only what's needed</span><span style="font-size: 14px; color: #5A554D">We collect only information with a clear purpose.</span></div>
      <div style="padding: 22px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3DCD0"><span style="display: block; font-weight: 800; margin-bottom: 6px">Separate lists</span><span style="font-size: 14px; color: #5A554D">Build Your Brand and Unicity enquiries are kept apart and never mixed.</span></div>
      <div style="padding: 22px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3DCD0"><span style="display: block; font-weight: 800; margin-bottom: 6px">Unsubscribe any time</span><span style="font-size: 14px; color: #5A554D">Every promotional email includes an unsubscribe link.</span></div>
      <div style="padding: 22px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3DCD0"><span style="display: block; font-weight: 800; margin-bottom: 6px">Secure forms</span><span style="font-size: 14px; color: #5A554D">HTTPS, spam protection and restricted access to your data.</span></div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; font-weight: 700">
      <a href="#privacy">Full Privacy Policy</a><a href="#terms">Terms of Use</a><a href="#cookies">Cookie &amp; analytics notice</a><a href="#disclaimer">Earnings &amp; product disclaimer</a>
    </div>
  </div>
</section>

<footer style="background: #111111; color: #B9B3A8; padding: 40px 0">
  <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-size: 13px">
    <span class="disp" style="font-size: 26px; color: #FFFFFF">WongEX<span style="color: #E9A23B">4U</span></span>
    <span>Building entrepreneurs. Creating opportunities. Inspiring the world.</span>
    <span>© 2026 WongEX</span>
  </div>
</footer>

</div>
</template>
<script>
/* WongEX page runtime: renders the template, handles state & events (no dependencies) */
(function(){
  class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; }
    setState(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (this._render) this._render(); }
    forceUpdate(){ if (this._render) this._render(); } }
  window.DCLogic = DCLogic;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function look(path, scope){
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++){ if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var EV = { onclick: 'click', onsubmit: 'submit', onchange: 'change', oninput: 'input' };
  function renderNodes(node, scope, ns){
    if (node.nodeType === 3){
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return [document.createTextNode(t)];
      return [document.createTextNode(t.replace(HOLE, function(_, p){ var v = look(p, scope); return v == null ? '' : String(v); }))];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.nodeName.toLowerCase();
    if (tag === 'sc-if'){
      var m = WHOLE.exec(node.getAttribute('value') || '');
      if (!(m && look(m[1], scope))) return [];
      return kids(node, scope, ns);
    }
    if (tag === 'sc-for'){
      var lm = WHOLE.exec(node.getAttribute('list') || ''); var list = lm ? look(lm[1], scope) : [];
      var as = node.getAttribute('as') || 'item', out = [];
      (list || []).forEach(function(it, i){ var s = Object.create(scope); s[as] = it; s.$index = i; out.push.apply(out, kids(node, s, ns)); });
      return out;
    }
    var SVG = 'http://www.w3.org/2000/svg'; if (tag === 'svg') ns = SVG;
    var el = ns ? document.createElementNS(ns, node.nodeName) : document.createElement(tag); el._dcH = {};
    for (var a = 0; a < node.attributes.length; a++){
      var at = node.attributes[a], name = at.name, val = at.value, lname = name.toLowerCase();
      if (lname.indexOf('hint-') === 0) continue;
      var w = WHOLE.exec(val);
      if (EV[lname]){ if (w){ var fn = look(w[1], scope); if (typeof fn === 'function') el._dcH[EV[lname]] = fn; } continue; }
      if (w){
        var v = look(w[1], scope);
        if (lname === 'checked'){ el._dcChecked = !!v; if (v) el.setAttribute('checked', ''); continue; }
        if (v === false || v == null) continue;
        el.setAttribute(name, v === true ? '' : String(v)); continue;
      }
      if (val.indexOf('{{') >= 0) val = val.replace(HOLE, function(_, p){ var x = look(p, scope); return x == null ? '' : String(x); });
      el.setAttribute(name, val);
    }
    kids(node, scope, ns).forEach(function(c){ el.appendChild(c); });
    return [el];
  }
  function kids(node, scope, ns){ var out = []; var src = node.content || node; for (var c = src.firstChild; c; c = c.nextSibling) out.push.apply(out, renderNodes(c, scope, ns)); return out; }
  function morph(from, to){
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){ from.parentNode.replaceChild(to, from); return; }
    if (from.nodeType === 3){ if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    var i;
    for (i = from.attributes.length - 1; i >= 0; i--){ var n = from.attributes[i].name; if (!to.hasAttribute(n)) from.removeAttribute(n); }
    for (i = 0; i < to.attributes.length; i++){ var at = to.attributes[i]; if (from.getAttribute(at.name) !== at.value) from.setAttribute(at.name, at.value); }
    from._dcH = to._dcH;
    if (to._dcChecked !== undefined){ from.checked = to._dcChecked; }
    patchChildren(from, Array.prototype.slice.call(to.childNodes));
  }
  function patchChildren(parent, next){
    var cur = Array.prototype.slice.call(parent.childNodes), i;
    for (i = 0; i < next.length; i++){ if (i < cur.length) morph(cur[i], next[i]); else parent.appendChild(next[i]); }
    for (i = next.length; i < cur.length; i++) parent.removeChild(cur[i]);
  }
  window.mountDC = function(root, tpl, Component){
    var comp = new Component({});
    comp._render = function(){ var vals = comp.renderVals ? comp.renderVals() : {}; patchChildren(root, kids(tpl, vals)); };
    ['click', 'submit', 'change', 'input'].forEach(function(type){
      root.addEventListener(type, function(e){
        for (var el = e.target; el && el !== root.parentNode; el = el.parentNode){ if (el._dcH && el._dcH[type]){ el._dcH[type](e); break; } }
      });
    });
    comp._render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { k: 'speak', done: false }; }
  renderVals() {
    const s = this.state;
    const list = [
      { k: 'start', label: 'I want to start a business' },
      { k: 'learn', label: 'I want to learn' },
      { k: 'unicity', label: 'I’m interested in Unicity' },
      { k: 'it', label: 'I need IT / digital services' },
      { k: 'collab', label: 'I want to collaborate' },
      { k: 'speak', label: 'Book Wonge to speak' }
    ];
    const routes = {
      start: { eyebrow: 'Free · Build Your Brand', title: 'Start with free guidance', body: 'Register for Build Your Brand to get free, practical lessons on turning an idea into a business — no fees, no requirement to join anything.', cta: 'Start free', href: 'build-your-brand.html', img: 'images/eco-business.svg' },
      learn: { eyebrow: 'Free Learning Hub', title: 'Learn at your own pace', body: 'Browse free lessons on branding, social media, content, sales, digital business and leadership.', cta: 'Open the hub', href: 'free-training.html', img: 'images/lesson-brand.svg' },
      unicity: { eyebrow: 'Unicity Business', title: 'Explore the opportunity', body: 'Learn about Wonge’s Unicity business and submit the separate Unicity interest form.', cta: 'Explore Unicity business', href: 'unicity-business.html', img: 'images/eco-unicity.svg' }
    };
    const forms = {
      it: { title: 'WongEX IT Solutions', sub: 'Websites, software, digital & payment solutions, automation and IT services.', cta: 'Request a quote' },
      collab: { title: 'Let’s collaborate', sub: 'Brand partnerships, joint ventures, events and content collaborations.', cta: 'Send proposal' },
      speak: { title: 'Book Wonge to speak', sub: 'Keynotes, workshops and interviews on entrepreneurship, leadership and personal development.', cta: 'Send booking request' }
    };
    const intents = list.map((i) => ({ ...i, pressed: s.k === i.k ? 'true' : 'false', bg: s.k === i.k ? '#111111' : '#FFFFFF', fg: s.k === i.k ? '#E9A23B' : '#111111', pick: () => this.setState({ k: i.k, done: false }) }));
    const isRoute = !!routes[s.k];
    return {
      intents, isRoute, isForm: !isRoute,
      route: routes[s.k] || routes.start,
      form: forms[s.k] || forms.speak,
      isIT: s.k === 'it', isSpeak: s.k === 'speak',
      formOpen: !s.done, formDone: s.done,
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ done: true }); },
      again: () => this.setState({ done: false })
    };
  }
}
mountDC(document.getElementById('app'), document.getElementById('page'), Component);
</script>
</body>
</html>

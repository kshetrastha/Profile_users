<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WongEX Free Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#8A520A}a:hover{color:#5E3705}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 24px}
.disp{font-family:'Anton','Impact',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;line-height:0.98;margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn-gold{background:#E9A23B;color:#111111}.btn-gold:hover{background:#F2B65A;color:#111111}
.btn-dark{background:#111111;color:#FFFFFF}.btn-dark:hover{background:#2A2825;color:#FFFFFF}
.navlink{color:#D9D3C7;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:0.1em}.navlink:hover{color:#E9A23B}
.card-hover{transition:transform .2s ease}.card-hover:hover{transform:translateY(-3px)}
</style>
</head>
<body>
<div id="app"></div>
<template id="page">


<div style="width: 100%; background: #F5F1EA; color: #111111; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.55">

<header style="background: #111111; border-bottom: 1px solid #2E2C28">
  <div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px">

      <span style="display: flex; flex-direction: column; line-height: 1"><span class="disp" style="font-size: 26px; color: #FFFFFF">WongEX<span style="color: #E9A23B">4U</span></span><span style="font-size: 11px; letter-spacing: 0.18em; color: #B9B3A8; margin-top: 4px">WONGE SHERPA</span></span>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center">
      <a class="navlink" href="index.html">HOME</a>
      <a class="navlink" href="about.html">ABOUT</a>
      <a class="navlink" href="index.html">ECOSYSTEM</a>
      <a class="navlink" href="free-training.html" style="color: #E9A23B">LEARN</a>
      <a class="navlink" href="stories.html">STORIES</a>
      <a class="navlink" href="media.html">MEDIA</a>
      <a class="navlink" href="impact.html">IMPACT</a>
      <a class="navlink" href="connect.html">CONNECT</a>
    </nav>
    <a class="btn btn-gold" href="build-your-brand.html">Join free →</a>
  </div>
</header>

<!-- HERO -->
<section style="background: #111111; color: #FFFFFF; padding: 80px 0 64px">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
    <p class="eyebrow" style="color: #E9A23B">Learn with Wonge · /free-training</p>
    <h1 class="disp" style="font-size: clamp(56px, 8vw, 120px); color: #FFFFFF">WongEX Free<br><span style="color: #E9A23B">Learning Hub</span></h1>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 18px; font-weight: 700">
      <span style="padding: 12px 20px; border-radius: 999px; border: 1.5px solid #4A4740; color: #D9D3C7">Employee mindset</span>
      <svg width="40" height="20" viewBox="0 0 40 20" fill="none" stroke="#E9A23B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 10h34M28 3l8 7-8 7"></path></svg>
      <span style="padding: 12px 20px; border-radius: 999px; background: #E9A23B; color: #111111">Entrepreneurial mindset</span>
    </div>
    <p style="margin: 0; max-width: 680px; font-size: 18px; color: #D9D3C7">Practical, free lessons on branding, social media, content, sales, digital business, growth and leadership. No membership, mentoring or training fees.</p>
  </div>
</section>

<!-- FILTER + GRID -->
<section style="padding: 72px 0 96px">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
    <div role="group" aria-label="Filter lessons by category" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="10">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #111111; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; color: #5A554D">{{countLabel}}</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px">
      <sc-for list="{{shown}}" as="l" hint-placeholder-count="6">
        <button type="button" onClick="{{l.play}}" class="card-hover" style="display: flex; flex-direction: column; gap: 12px; padding: 0 0 18px; border: 1px solid #E3DCD0; border-radius: 18px; overflow: hidden; background: #FFFFFF; text-align: left; font: inherit; color: #111111; cursor: pointer">
          <span style="position: relative; display: block; width: 100%">
            <img src="{{l.img}}" alt="" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover">
            <span style="position: absolute; left: 14px; bottom: 14px; width: 46px; height: 46px; border-radius: 999px; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#E9A23B" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
            <span style="position: absolute; right: 12px; bottom: 14px; padding: 4px 10px; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 12px; font-weight: 700">{{l.len}}</span>
          </span>
          <span style="padding: 0 18px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #8A520A">{{l.cat}} · {{l.level}}</span>
          <span class="disp" style="padding: 0 18px; font-size: 24px">{{l.title}}</span>
          <span style="padding: 0 18px; font-size: 14px; color: #5A554D">{{l.desc}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</section>

<!-- PATH -->
<section style="background: #EDE6DA; padding: 88px 0">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <p class="eyebrow" style="color: #8A520A">Suggested learning path</p>
      <h2 class="disp" style="font-size: clamp(40px, 5vw, 64px)">Not sure where to start?</h2>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
      <li style="display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 18px; background: #FFFFFF"><span class="disp" style="font-size: 40px; color: #8A520A">01</span><span class="disp" style="font-size: 22px">Start your brand</span><span style="font-size: 14px; color: #5A554D">Identity, message, audience, positioning.</span></li>
      <li style="display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 18px; background: #FFFFFF"><span class="disp" style="font-size: 40px; color: #8A520A">02</span><span class="disp" style="font-size: 22px">Show up online</span><span style="font-size: 14px; color: #5A554D">Social media and content creation basics.</span></li>
      <li style="display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 18px; background: #FFFFFF"><span class="disp" style="font-size: 40px; color: #8A520A">03</span><span class="disp" style="font-size: 22px">Reach customers</span><span style="font-size: 14px; color: #5A554D">Sales, marketing and follow-up.</span></li>
      <li style="display: flex; flex-direction: column; gap: 8px; padding: 24px; border-radius: 18px; background: #111111; color: #FFFFFF"><span class="disp" style="font-size: 40px; color: #E9A23B">04</span><span class="disp" style="font-size: 22px; color: #FFFFFF">Grow &amp; lead</span><span style="font-size: 14px; color: #D9D3C7">Systems, teams, global thinking, leadership.</span></li>
    </ol>
  </div>
</section>

<!-- CTA -->
<section style="padding: 88px 0">
  <div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: center; padding-top: 48px; padding-bottom: 48px; border-radius: 28px; background: #E9A23B">
    <h2 class="disp" style="font-size: clamp(40px, 5vw, 64px); padding-left: 16px">Get new lessons first — free</h2>
    <div style="display: flex; flex-direction: column; gap: 14px; padding-right: 16px">
      <p style="margin: 0; font-size: 17px; color: #2A1C06">Register for Build Your Brand to unlock the full hub and receive new lessons as they are published.</p>
      <a class="btn btn-dark" href="build-your-brand.html" style="align-self: flex-start">Register free →</a>
    </div>
  </div>
</section>

<footer style="background: #111111; color: #B9B3A8; padding: 40px 0">
  <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-size: 13px">
    <span class="disp" style="font-size: 26px; color: #FFFFFF">WongEX<span style="color: #E9A23B">4U</span></span>
    <span>Educational content only — not financial, legal or health advice.</span>
    <span>© 2026 WongEX · <a href="connect.html" style="color: #B9B3A8">Privacy</a> · <a href="connect.html" style="color: #B9B3A8">Terms</a></span>
  </div>
</footer>

<sc-if value="{{videoOpen}}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-modal="true" aria-label="Lesson video" style="position: fixed; inset: 0; z-index: 50; background: rgba(17, 17, 17, 0.9); display: flex; align-items: center; justify-content: center; padding: 24px">
    <div style="width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
        <span class="disp" style="font-size: 30px; color: #FFFFFF">{{vid.title}}</span>
        <button type="button" onClick="{{closeVideo}}" aria-label="Close video" style="width: 48px; height: 48px; flex: none; border-radius: 999px; border: 1.5px solid #4A4740; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div style="position: relative; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #000000">
        <img src="{{vid.img}}" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0.4">
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: #E9A23B">VIDEO SLOT · {{vid.cat}}</span>
          <span style="max-width: 520px; font-size: 18px; font-weight: 600; color: #FFFFFF">Connect the MP4 file or YouTube / Vimeo link for this lesson here.</span>
        </div>
      </div>
    </div>
  </div>
</sc-if>

</div>
</template>
<script>
/* WongEX page runtime: renders the template, handles state & events (no dependencies) */
(function(){
  class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; }
    setState(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (this._render) this._render(); }
    forceUpdate(){ if (this._render) this._render(); } }
  window.DCLogic = DCLogic;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function look(path, scope){
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++){ if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var EV = { onclick: 'click', onsubmit: 'submit', onchange: 'change', oninput: 'input' };
  function renderNodes(node, scope, ns){
    if (node.nodeType === 3){
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return [document.createTextNode(t)];
      return [document.createTextNode(t.replace(HOLE, function(_, p){ var v = look(p, scope); return v == null ? '' : String(v); }))];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.nodeName.toLowerCase();
    if (tag === 'sc-if'){
      var m = WHOLE.exec(node.getAttribute('value') || '');
      if (!(m && look(m[1], scope))) return [];
      return kids(node, scope, ns);
    }
    if (tag === 'sc-for'){
      var lm = WHOLE.exec(node.getAttribute('list') || ''); var list = lm ? look(lm[1], scope) : [];
      var as = node.getAttribute('as') || 'item', out = [];
      (list || []).forEach(function(it, i){ var s = Object.create(scope); s[as] = it; s.$index = i; out.push.apply(out, kids(node, s, ns)); });
      return out;
    }
    var SVG = 'http://www.w3.org/2000/svg'; if (tag === 'svg') ns = SVG;
    var el = ns ? document.createElementNS(ns, node.nodeName) : document.createElement(tag); el._dcH = {};
    for (var a = 0; a < node.attributes.length; a++){
      var at = node.attributes[a], name = at.name, val = at.value, lname = name.toLowerCase();
      if (lname.indexOf('hint-') === 0) continue;
      var w = WHOLE.exec(val);
      if (EV[lname]){ if (w){ var fn = look(w[1], scope); if (typeof fn === 'function') el._dcH[EV[lname]] = fn; } continue; }
      if (w){
        var v = look(w[1], scope);
        if (lname === 'checked'){ el._dcChecked = !!v; if (v) el.setAttribute('checked', ''); continue; }
        if (v === false || v == null) continue;
        el.setAttribute(name, v === true ? '' : String(v)); continue;
      }
      if (val.indexOf('{{') >= 0) val = val.replace(HOLE, function(_, p){ var x = look(p, scope); return x == null ? '' : String(x); });
      el.setAttribute(name, val);
    }
    kids(node, scope, ns).forEach(function(c){ el.appendChild(c); });
    return [el];
  }
  function kids(node, scope, ns){ var out = []; var src = node.content || node; for (var c = src.firstChild; c; c = c.nextSibling) out.push.apply(out, renderNodes(c, scope, ns)); return out; }
  function morph(from, to){
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){ from.parentNode.replaceChild(to, from); return; }
    if (from.nodeType === 3){ if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    var i;
    for (i = from.attributes.length - 1; i >= 0; i--){ var n = from.attributes[i].name; if (!to.hasAttribute(n)) from.removeAttribute(n); }
    for (i = 0; i < to.attributes.length; i++){ var at = to.attributes[i]; if (from.getAttribute(at.name) !== at.value) from.setAttribute(at.name, at.value); }
    from._dcH = to._dcH;
    if (to._dcChecked !== undefined){ from.checked = to._dcChecked; }
    patchChildren(from, Array.prototype.slice.call(to.childNodes));
  }
  function patchChildren(parent, next){
    var cur = Array.prototype.slice.call(parent.childNodes), i;
    for (i = 0; i < next.length; i++){ if (i < cur.length) morph(cur[i], next[i]); else parent.appendChild(next[i]); }
    for (i = next.length; i < cur.length; i++) parent.removeChild(cur[i]);
  }
  window.mountDC = function(root, tpl, Component){
    var comp = new Component({});
    comp._render = function(){ var vals = comp.renderVals ? comp.renderVals() : {}; patchChildren(root, kids(tpl, vals)); };
    ['click', 'submit', 'change', 'input'].forEach(function(type){
      root.addEventListener(type, function(e){
        for (var el = e.target; el && el !== root.parentNode; el = el.parentNode){ if (el._dcH && el._dcH[type]){ el._dcH[type](e); break; } }
      });
    });
    comp._render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'All', vid: null }; }
  renderVals() {
    const s = this.state;
    const IB = 'images/lesson-brand.svg', IS = 'images/lesson-social.svg', ISA = 'images/lesson-sales.svg', IBU = 'images/eco-business.svg', IIT = 'images/eco-it.svg', IGL = 'images/global.svg', IST = 'images/mission.svg', IWX = 'images/wongex.svg';
    const lessons = [
      { cat: 'Start your brand', level: 'Beginner', title: 'Choose your brand identity', desc: 'Who you are, what you stand for and who you serve.', img: IB },
      { cat: 'Start your brand', level: 'Beginner', title: 'Write your one-line message', desc: 'Say clearly what you do in one sentence.', img: IB },
      { cat: 'Social media', level: 'Beginner', title: 'Pick the right platforms', desc: 'Instagram, TikTok, Facebook, YouTube, LinkedIn and X.', img: IS },
      { cat: 'Content creation', level: 'Beginner', title: 'Hooks that stop the scroll', desc: 'Open every video with a reason to keep watching.', img: IS },
      { cat: 'Content creation', level: 'Intermediate', title: 'Storytelling for business', desc: 'Turn your experience into content people remember.', img: IST },
      { cat: 'Starting a business', level: 'Beginner', title: 'From skill to business', desc: 'Turn skills, ideas or products into an offer.', img: IBU },
      { cat: 'Sales & marketing', level: 'Beginner', title: 'Follow-up that builds trust', desc: 'Communication, follow-up and long-term relationships.', img: ISA },
      { cat: 'Digital business', level: 'Beginner', title: 'Using AI in your business', desc: 'Practical AI and productivity tools for small businesses.', img: IIT },
      { cat: 'Business growth', level: 'Intermediate', title: 'Systems before scale', desc: 'Simple systems, teams and sustainable expansion.', img: IWX },
      { cat: 'Global thinking', level: 'Intermediate', title: 'Selling beyond your city', desc: 'How digital platforms open broader markets.', img: IGL },
      { cat: 'Leadership', level: 'All levels', title: 'Discipline & confidence', desc: 'Responsibility, consistency and developing others.', img: IST },
      { cat: 'Leadership', level: 'All levels', title: 'Building a team', desc: 'Communication and leading people well.', img: IWX }
    ].map((l, k) => ({ ...l, len: '[MM:SS]', play: () => this.setState({ vid: k }) }));
    const catNames = ['All', 'Start your brand', 'Social media', 'Content creation', 'Starting a business', 'Sales & marketing', 'Digital business', 'Business growth', 'Global thinking', 'Leadership'];
    const cats = catNames.map((c) => ({ label: c === 'All' ? 'All topics' : c, pressed: s.cat === c ? 'true' : 'false', bg: s.cat === c ? '#111111' : 'transparent', fg: s.cat === c ? '#E9A23B' : '#111111', pick: () => this.setState({ cat: c }) }));
    const shown = s.cat === 'All' ? lessons : lessons.filter((l) => l.cat === s.cat);
    return {
      cats, shown,
      countLabel: shown.length + (shown.length === 1 ? ' free lesson' : ' free lessons'),
      videoOpen: s.vid !== null,
      vid: s.vid !== null ? lessons[s.vid] : { title: '', img: '', cat: '' },
      closeVideo: () => this.setState({ vid: null })
    };
  }
}
mountDC(document.getElementById('app'), document.getElementById('page'), Component);
</script>
</body>
</html>

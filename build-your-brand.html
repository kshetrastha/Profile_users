      <p style="margin: 0">Throughout my journey, I have invested time and money into education, training, mentors, business experience, networking, technology, social media, and learning from other people.</p>
      <p style="margin: 0; font-weight: 700; color: #111111">I have learned from success. I have learned from failure. I have learned from mistakes. And I am still learning every day.</p>
      <p style="margin: 0">I believe knowledge becomes more powerful when we share it. That is why I created BUILD YOUR BRAND with WongEX — to share useful lessons from my experience and continued learning with people around the world who want to build something of their own.</p>
      <p style="margin: 0">You may have an idea but not know where to start. You may already own a business but struggle with branding or social media. You may have an excellent product or service but not know how to reach people. You may simply want to develop your professional identity.</p>

<section id="register" style="padding: 96px 0">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
      <p class="eyebrow" style="color: #8A520A">Free registration</p>
      <h2 class="disp" style="font-size: clamp(44px, 6vw, 80px)">Start building your brand</h2>
      <p style="margin: 0; max-width: 640px; font-size: 17px; color: #3A3732">Join the global WongEX learning community and access free educational content and guidance.</p>
    </div>
    <ol aria-label="Registration steps" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
        <li style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; background: {{st.bg}}; color: {{st.fg}}"><span style="width: 32px; height: 32px; flex: none; border-radius: 999px; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{st.n}}</span><span style="font-weight: 700; font-size: 14px">{{st.label}}</span></li>
      </sc-for>
    </ol>
    <div style="padding: 44px; border-radius: 28px; background: #FFFFFF; border: 1px solid #E3DCD0">
      <sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 20px">
          <p class="eyebrow" style="color: #8A520A">Step 1 — Tell us about you</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
            <label class="field">Full name*<input type="text" required="required" autocomplete="name"></label>
            <label class="field">Email address*<input type="email" required="required" autocomplete="email"></label>
            <label class="field">Mobile / WhatsApp number*<input type="tel" required="required" autocomplete="tel"></label>
            <label class="field">Country*<select required="required"><option value="">Select country</option><option>Canada</option><option>Nepal</option><option>United States</option><option>United Kingdom</option><option>Australia</option><option>India</option><option>United Arab Emirates</option><option>Other</option></select></label>
          </div>
          <fieldset style="margin: 0; padding: 0; border: none">
            <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Do you currently have a business?</legend>
            <div style="display: flex; flex-wrap: wrap; gap: 10px">
              <label class="chk"><input type="radio" name="biz" checked="{{isYes}}" onChange="{{setYes}}">Yes</label>
              <label class="chk"><input type="radio" name="biz" checked="{{isNo}}" onChange="{{setNo}}">No</label>
              <label class="chk"><input type="radio" name="biz" checked="{{isPlan}}" onChange="{{setPlan}}">Planning to start</label>
            </div>
          </fieldset>
          <sc-if value="{{isYes}}" hint-placeholder-val="{{ false }}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
              <label class="field">Business / brand name<input type="text"></label>
              <label class="field">What type of business do you operate?<input type="text"></label>
            </div>
          </sc-if>
          <sc-if value="{{showBuild}}" hint-placeholder-val="{{ true }}">
            <label class="field">What would you like to build?<input type="text"></label>
          </sc-if>
          <fieldset style="margin: 0; padding: 0; border: none">
            <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">Primary goal (choose any)</legend>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px">
              <sc-for list="{{goals}}" as="g" hint-placeholder-count="10">
                <label class="chk"><input type="checkbox">{{g}}</label>
              </sc-for>
            </div>
          </fieldset>
          <label class="field" style="max-width: 300px">Preferred language (optional)<select><option>English</option><option>Nepali</option><option>Hindi</option><option>Other</option></select></label>
          <div style="padding: 16px 18px; border-radius: 12px; background: #F5F1EA; font-size: 13px; color: #5A554D; display: flex; flex-direction: column; gap: 10px">
            <span><strong style="color: #111111">Privacy:</strong> We use these details only to send you Build Your Brand learning content and updates. You are added to the Build Your Brand community list only — not to any Unicity or other business list. Unsubscribe any time. <a href="connect.html">Privacy Policy</a></span>
            <label style="display: flex; gap: 10px; align-items: flex-start; color: #3A3732"><input type="checkbox" required="required" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #111111">I agree to receive free educational emails and messages from WongEX.</label>
          </div>
          <button type="submit" class="btn btn-dark" style="align-self: flex-start; min-height: 56px; padding: 0 32px">Join free →</button>
        </form>
      </sc-if>
      <sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 20px">
          <p class="eyebrow" style="color: #8A520A">Step 2 — Connect with WongEX</p>
          <h3 class="disp" style="font-size: clamp(36px, 4vw, 52px)">Welcome to Build Your Brand with WongEX</h3>
          <p style="margin: 0; font-size: 17px; color: #3A3732">Your learning journey starts here. Follow the official channels for new lessons — each opens the official account so you can follow voluntarily.</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
            <a href="#instagram" class="card-hover" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; border: 1.5px solid #E3DCD0; text-decoration: none; color: #111111"><span style="font-weight: 800">Instagram</span><span style="font-size: 14px; color: #5A554D">Branding, business and short educational content.</span><span style="margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8A520A">FOLLOW ON INSTAGRAM →</span></a>
            <a href="#tiktok" class="card-hover" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; border: 1.5px solid #E3DCD0; text-decoration: none; color: #111111"><span style="font-weight: 800">TikTok</span><span style="font-size: 14px; color: #5A554D">Practical short-form business and social-media lessons.</span><span style="margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8A520A">FOLLOW ON TIKTOK →</span></a>
            <a href="#youtube" class="card-hover" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; border: 1.5px solid #E3DCD0; text-decoration: none; color: #111111"><span style="font-weight: 800">YouTube</span><span style="font-size: 14px; color: #5A554D">Longer training, explanations and business education.</span><span style="margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8A520A">SUBSCRIBE ON YOUTUBE →</span></a>
            <a href="#facebook" class="card-hover" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; border: 1.5px solid #E3DCD0; text-decoration: none; color: #111111"><span style="font-weight: 800">Facebook</span><span style="font-size: 14px; color: #5A554D">Videos, community updates and educational content.</span><span style="margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8A520A">FOLLOW ON FACEBOOK →</span></a>
            <a href="#x" class="card-hover" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; border: 1.5px solid #E3DCD0; text-decoration: none; color: #111111"><span style="font-weight: 800">X</span><span style="font-size: 14px; color: #5A554D">Ideas, business insights and WongEX updates.</span><span style="margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8A520A">FOLLOW ON X →</span></a>
            <a href="#linkedin" class="card-hover" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 16px; border: 1.5px solid #E3DCD0; text-decoration: none; color: #111111"><span style="font-weight: 800">LinkedIn</span><span style="font-size: 14px; color: #5A554D">Entrepreneurship, leadership and professional content.</span><span style="margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8A520A">FOLLOW ON LINKEDIN →</span></a>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 12px">
            <button type="button" onClick="{{toStep3}}" class="btn btn-dark">Continue to the free hub →</button>
            <button type="button" onClick="{{reset}}" class="btn btn-ghost-l">Register someone else</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 20px">
          <p class="eyebrow" style="color: #8A520A">Step 3 — Start learning</p>
          <h3 class="disp" style="font-size: clamp(36px, 4vw, 52px)">Your first free lessons</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
            <a href="free-training.html" class="card-hover" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #111111"><img src="images/lesson-brand.svg" alt="" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: block"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #8A520A">START YOUR BRAND</span><span class="disp" style="font-size: 22px">Choose your identity &amp; message</span></a>
            <a href="free-training.html" class="card-hover" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #111111"><img src="images/lesson-social.svg" alt="" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: block"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #8A520A">SOCIAL MEDIA</span><span class="disp" style="font-size: 22px">Your first 30 days of content</span></a>
            <a href="free-training.html" class="card-hover" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #111111"><img src="images/lesson-sales.svg" alt="" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: block"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #8A520A">SALES &amp; MARKETING</span><span class="disp" style="font-size: 22px">Talking to your first customers</span></a>
          </div>
          <a class="btn btn-gold" href="free-training.html" style="align-self: flex-start">Open the Free Learning Hub →</a>

<script>
/* WongEX page runtime: renders the template, handles state & events (no dependencies) */
(function(){
  class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; }
    setState(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (this._render) this._render(); }
    forceUpdate(){ if (this._render) this._render(); } }
  window.DCLogic = DCLogic;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function look(path, scope){
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++){ if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var EV = { onclick: 'click', onsubmit: 'submit', onchange: 'change', oninput: 'input' };
  function renderNodes(node, scope, ns){
    if (node.nodeType === 3){
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return [document.createTextNode(t)];
      return [document.createTextNode(t.replace(HOLE, function(_, p){ var v = look(p, scope); return v == null ? '' : String(v); }))];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.nodeName.toLowerCase();
    if (tag === 'sc-if'){
      var m = WHOLE.exec(node.getAttribute('value') || '');
      if (!(m && look(m[1], scope))) return [];
      return kids(node, scope, ns);
    }
    if (tag === 'sc-for'){
      var lm = WHOLE.exec(node.getAttribute('list') || ''); var list = lm ? look(lm[1], scope) : [];
      var as = node.getAttribute('as') || 'item', out = [];
      (list || []).forEach(function(it, i){ var s = Object.create(scope); s[as] = it; s.$index = i; out.push.apply(out, kids(node, s, ns)); });
      return out;
    }
    var SVG = 'http://www.w3.org/2000/svg'; if (tag === 'svg') ns = SVG;
    var el = ns ? document.createElementNS(ns, node.nodeName) : document.createElement(tag); el._dcH = {};
    for (var a = 0; a < node.attributes.length; a++){
      var at = node.attributes[a], name = at.name, val = at.value, lname = name.toLowerCase();
      if (lname.indexOf('hint-') === 0) continue;
      var w = WHOLE.exec(val);
      if (EV[lname]){ if (w){ var fn = look(w[1], scope); if (typeof fn === 'function') el._dcH[EV[lname]] = fn; } continue; }
      if (w){
        var v = look(w[1], scope);
        if (lname === 'checked'){ el._dcChecked = !!v; if (v) el.setAttribute('checked', ''); continue; }
        if (v === false || v == null) continue;
        el.setAttribute(name, v === true ? '' : String(v)); continue;
      }
      if (val.indexOf('{{') >= 0) val = val.replace(HOLE, function(_, p){ var x = look(p, scope); return x == null ? '' : String(x); });
      el.setAttribute(name, val);

  }
  function kids(node, scope, ns){ var out = []; var src = node.content || node; for (var c = src.firstChild; c; c = c.nextSibling) out.push.apply(out, renderNodes(c, scope, ns)); return out; }

    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){ from.parentNode.replaceChild(to, from); return; }
    if (from.nodeType === 3){ if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    var i;
    for (i = from.attributes.length - 1; i >= 0; i--){ var n = from.attributes[i].name; if (!to.hasAttribute(n)) from.removeAttribute(n); }
    for (i = 0; i < to.attributes.length; i++){ var at = to.attributes[i]; if (from.getAttribute(at.name) !== at.value) from.setAttribute(at.name, at.value); }
    from._dcH = to._dcH;
    if (to._dcChecked !== undefined){ from.checked = to._dcChecked; }
    patchChildren(from, Array.prototype.slice.call(to.childNodes));
  }
  function patchChildren(parent, next){
    var cur = Array.prototype.slice.call(parent.childNodes), i;
    for (i = 0; i < next.length; i++){ if (i < cur.length) morph(cur[i], next[i]); else parent.appendChild(next[i]); }
    for (i = next.length; i < cur.length; i++) parent.removeChild(cur[i]);
  }
  window.mountDC = function(root, tpl, Component){
    var comp = new Component({});
    comp._render = function(){ var vals = comp.renderVals ? comp.renderVals() : {}; patchChildren(root, kids(tpl, vals)); };
    ['click', 'submit', 'change', 'input'].forEach(function(type){
      root.addEventListener(type, function(e){
        for (var el = e.target; el && el !== root.parentNode; el = el.parentNode){ if (el._dcH && el._dcH[type]){ el._dcH[type](e); break; } }
      });
    });
    comp._render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 1, biz: 'no', faq: 0, video: false }; }
  renderVals() {
    const s = this.state;
    const labels = ['Tell us about you', 'Connect with WongEX', 'Start learning'];
    const steps = labels.map((l, k) => {
      const n = k + 1; const on = n === s.step; const done = n < s.step;
      return { n: done ? '✓' : String(n), label: l, bg: on ? '#111111' : (done ? '#E9A23B' : '#FFFFFF'), fg: on ? '#FFFFFF' : '#111111' };
    });
    const faqData = [
      { q: 'Is Build Your Brand really free?', a: 'Yes. There is no membership fee, no mentoring fee and no training fee for the Build Your Brand educational guidance.' },
      { q: 'Do I have to join Unicity or buy anything?', a: 'No. The free education does not require you to join Unicity, purchase a product, or enter any other WongEX business.' },
      { q: 'What will I receive after registering?', a: 'Access to the WongEX Free Learning Hub, new lessons as they are published, and links to follow the official WongEX channels.' },
      { q: 'Will my business grow if I join?', a: 'We share free educational guidance, resources and practical lessons. Results depend on your actions, experience, market, business and resources — no outcome is guaranteed.' },
      { q: 'How is my information used?', a: 'Only to send you Build Your Brand learning content. You are not added to unrelated marketing lists, and you can unsubscribe at any time.' }
    ];
    const faqs = faqData.map((f, k) => ({ ...f, open: s.faq === k, expanded: s.faq === k ? 'true' : 'false', icon: s.faq === k ? '−' : '+', toggle: () => this.setState({ faq: s.faq === k ? -1 : k }) }));
    return {
      steps, faqs,
      goals: ['Build my personal brand', 'Start a business', 'Grow my existing business', 'Learn social media', 'Learn content creation', 'Learn sales and marketing', 'Improve my online presence', 'Reach customers internationally', 'Develop leadership skills', 'Not sure yet — I need guidance'],
      isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3,
      isYes: s.biz === 'yes', isNo: s.biz === 'no', isPlan: s.biz === 'plan', showBuild: s.biz !== 'yes',
      setYes: () => this.setState({ biz: 'yes' }), setNo: () => this.setState({ biz: 'no' }), setPlan: () => this.setState({ biz: 'plan' }),
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ step: 2 }); },
      toStep3: () => this.setState({ step: 3 }),
      reset: () => this.setState({ step: 1 }),
      videoOpen: s.video,
      openVideo: () => this.setState({ video: true }),
      closeVideo: () => this.setState({ video: false })
    };
  }
}
mountDC(document.getElementById('app'), document.getElementById('page'), Component);
</script>

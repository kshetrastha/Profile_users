<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impact — WongEX Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#8A520A}a:hover{color:#5E3705}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 24px}
.disp{font-family:'Anton','Impact',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;line-height:0.98;margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn-gold{background:#E9A23B;color:#111111}.btn-gold:hover{background:#F2B65A;color:#111111}
.btn-dark{background:#111111;color:#FFFFFF}.btn-dark:hover{background:#2A2825;color:#FFFFFF}
.btn-ghost-l{border-color:#111111;color:#111111}.btn-ghost-l:hover{background:#111111;color:#FFFFFF}
.navlink{color:#D9D3C7;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:0.1em}.navlink:hover{color:#E9A23B}
</style>
</head>
<body>
<div id="app"></div>
<template id="page">


<div style="width: 100%; background: #F5F1EA; color: #111111; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.55">

<header style="background: #111111; border-bottom: 1px solid #2E2C28">
  <div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px">
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF">
      <span style="width: 44px; height: 44px; border-radius: 10px; background: #E9A23B; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M2 20 L9 7 L13 13 L16 9 L22 20 Z"></path></svg></span>
      <span style="display: flex; flex-direction: column; line-height: 1"><span class="disp" style="font-size: 26px; color: #FFFFFF">WongEX<span style="color: #E9A23B">4U</span></span><span style="font-size: 11px; letter-spacing: 0.18em; color: #B9B3A8; margin-top: 4px">WONGE SHERPA</span></span>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center">
      <a class="navlink" href="index.html">HOME</a>
      <a class="navlink" href="about.html">ABOUT</a>
      <a class="navlink" href="index.html">ECOSYSTEM</a>
      <a class="navlink" href="free-training.html">LEARN</a>
      <a class="navlink" href="stories.html">STORIES</a>
      <a class="navlink" href="media.html">MEDIA</a>
      <a class="navlink" href="impact.html" style="color: #E9A23B">IMPACT</a>
      <a class="navlink" href="connect.html">CONNECT</a>
    </nav>
    <a class="btn btn-gold" href="#involved">Get involved →</a>
  </div>
</header>

<!-- HERO -->
<section style="position: relative; background: #3C3328; color: #FFFFFF; overflow: hidden">
  <img src="images/impact.svg" alt="A community gathered at sunrise" style="display: block; width: 100%; height: 620px; object-fit: cover">
  <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; padding-bottom: 56px">
    <div class="wrap" style="display: flex; flex-direction: column; gap: 16px">
      <p class="eyebrow" style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #111111; color: #E9A23B">WongEX Foundation · Success with purpose</p>
      <h1 class="disp" style="font-size: clamp(56px, 8vw, 120px); color: #FFFFFF; max-width: 980px">Success means more when we lift others.</h1>
    </div>
  </div>
</section>

<!-- MISSION -->
<section style="padding: 96px 0">
  <div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <p class="eyebrow" style="color: #8A520A">Our long-term mission</p>
      <h2 class="disp" style="font-size: clamp(40px, 5vw, 64px)">Where commercial success meets a bigger purpose</h2>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; font-size: 17px; color: #3A3732">
      <p style="margin: 0">I don't want this story to end at money. My vision is to use part of WongEX's success, resources and network to support people who need education, healthcare, essential support and opportunity.</p>
      <p style="margin: 0">The WongEX Foundation is being planned step by step. As it grows, it will publish clear, transparent impact reporting so supporters can see exactly where help goes.</p>
      <p style="margin: 0; font-weight: 800; color: #111111">— Wonge Sherpa</p>
    </div>
  </div>
</section>

<!-- PILLARS (interactive) -->
<section style="background: #111111; color: #FFFFFF; padding: 96px 0">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <p class="eyebrow" style="color: #E9A23B">Focus areas</p>
      <h2 class="disp" style="font-size: clamp(40px, 5vw, 64px); color: #FFFFFF">Five ways to help</h2>
    </div>
    <div role="tablist" aria-label="Focus areas" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px">
      <sc-for list="{{pillars}}" as="p" hint-placeholder-count="5">
        <button type="button" role="tab" onClick="{{p.pick}}" aria-selected="{{p.selected}}" style="min-height: 64px; padding: 0 18px; border-radius: 14px; border: 1.5px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Anton', 'Impact', sans-serif; font-size: 22px; text-transform: uppercase; cursor: pointer">{{p.label}}</button>
      </sc-for>
    </div>
    <div role="tabpanel" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: center; padding: 36px; border-radius: 24px; background: #1C1B19; border: 1px solid #2E2C28">
      <img src="{{cur.img}}" alt="" style="width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 16px; display: block">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span class="disp" style="font-size: 44px; color: #E9A23B">{{cur.label}}</span>
        <p style="margin: 0; font-size: 17px; color: #D9D3C7">{{cur.body}}</p>
        <p style="margin: 0; font-size: 14px; color: #B9B3A8">Planned initiatives: {{cur.plan}}</p>
      </div>
    </div>
  </div>
</section>

<!-- REPORTING -->
<section style="padding: 96px 0">
  <div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
      <p class="eyebrow" style="color: #8A520A">Transparent impact reporting</p>
      <h2 class="disp" style="font-size: clamp(40px, 5vw, 64px)">Every contribution, accounted for</h2>
      <p style="margin: 0; max-width: 640px; color: #5A554D">These figures will be published once the foundation's first programs are running and verified.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
      <div style="padding: 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DCD0"><span class="disp" style="display: block; font-size: 48px; color: #8A520A">[—]</span><span style="font-weight: 700">Students supported</span></div>
      <div style="padding: 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DCD0"><span class="disp" style="display: block; font-size: 48px; color: #8A520A">[—]</span><span style="font-weight: 700">Health camps funded</span></div>
      <div style="padding: 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DCD0"><span class="disp" style="display: block; font-size: 48px; color: #8A520A">[—]</span><span style="font-weight: 700">Families assisted</span></div>
      <div style="padding: 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DCD0"><span class="disp" style="display: block; font-size: 48px; color: #8A520A">[—]</span><span style="font-weight: 700">Communities reached</span></div>
    </div>
    <a class="btn btn-ghost-l" href="#reports" style="align-self: center">Annual impact report [coming soon]</a>
  </div>
</section>

<!-- GET INVOLVED -->
<section id="involved" style="background: #E9A23B; padding: 96px 0">
  <div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <p class="eyebrow" style="color: #3A2508">Get involved</p>
      <h2 class="disp" style="font-size: clamp(44px, 6vw, 76px)">Help us lift others</h2>
      <p style="margin: 0; font-size: 17px; color: #2A1C06">Volunteer your skills, partner as an organization, or register interest in supporting future programs.</p>
    </div>
    <div style="padding: 32px; border-radius: 24px; background: #111111; color: #FFFFFF">
      <sc-if value="{{formOpen}}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #D9D3C7">Full name*<input type="text" required="required" autocomplete="name" style="min-height: 48px; border-radius: 10px; border: 1.5px solid #3A3833; background: #1C1B19; padding: 0 14px; font: inherit; font-size: 15px; color: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #D9D3C7">Email*<input type="email" required="required" autocomplete="email" style="min-height: 48px; border-radius: 10px; border: 1.5px solid #3A3833; background: #1C1B19; padding: 0 14px; font: inherit; font-size: 15px; color: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #D9D3C7">I'd like to<select style="min-height: 48px; border-radius: 10px; border: 1.5px solid #3A3833; background: #1C1B19; padding: 0 14px; font: inherit; font-size: 15px; color: #FFFFFF"><option>Volunteer my skills</option><option>Partner as an organization</option><option>Support future programs</option><option>Suggest a community in need</option></select></label>
          <button type="submit" class="btn btn-gold">Register interest →</button>
        </form>
      </sc-if>
      <sc-if value="{{formDone}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 12px; min-height: 260px; justify-content: center">
          <span class="disp" style="font-size: 36px; color: #E9A23B">Thank you</span>
          <p style="margin: 0; color: #D9D3C7">We'll be in touch as foundation programs open.</p>
        </div>
      </sc-if>
    </div>
  </div>
</section>

<footer style="background: #111111; color: #B9B3A8; padding: 40px 0">
  <div class="wrap" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-size: 13px">
    <span class="disp" style="font-size: 26px; color: #FFFFFF">WongEX<span style="color: #E9A23B">4U</span></span>
    <span>WongEX Foundation is in planning. [Registration details once incorporated.]</span>
    <span>© 2026 WongEX · <a href="connect.html" style="color: #B9B3A8">Privacy</a></span>
  </div>
</footer>

</div>
</template>
<script>
/* WongEX page runtime: renders the template, handles state & events (no dependencies) */
(function(){
  class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; }
    setState(p){ Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); if (this._render) this._render(); }
    forceUpdate(){ if (this._render) this._render(); } }
  window.DCLogic = DCLogic;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function look(path, scope){
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++){ if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var EV = { onclick: 'click', onsubmit: 'submit', onchange: 'change', oninput: 'input' };
  function renderNodes(node, scope, ns){
    if (node.nodeType === 3){
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return [document.createTextNode(t)];
      return [document.createTextNode(t.replace(HOLE, function(_, p){ var v = look(p, scope); return v == null ? '' : String(v); }))];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.nodeName.toLowerCase();
    if (tag === 'sc-if'){
      var m = WHOLE.exec(node.getAttribute('value') || '');
      if (!(m && look(m[1], scope))) return [];
      return kids(node, scope, ns);
    }
    if (tag === 'sc-for'){
      var lm = WHOLE.exec(node.getAttribute('list') || ''); var list = lm ? look(lm[1], scope) : [];
      var as = node.getAttribute('as') || 'item', out = [];
      (list || []).forEach(function(it, i){ var s = Object.create(scope); s[as] = it; s.$index = i; out.push.apply(out, kids(node, s, ns)); });
      return out;
    }
    var SVG = 'http://www.w3.org/2000/svg'; if (tag === 'svg') ns = SVG;
    var el = ns ? document.createElementNS(ns, node.nodeName) : document.createElement(tag); el._dcH = {};
    for (var a = 0; a < node.attributes.length; a++){
      var at = node.attributes[a], name = at.name, val = at.value, lname = name.toLowerCase();
      if (lname.indexOf('hint-') === 0) continue;
      var w = WHOLE.exec(val);
      if (EV[lname]){ if (w){ var fn = look(w[1], scope); if (typeof fn === 'function') el._dcH[EV[lname]] = fn; } continue; }
      if (w){
        var v = look(w[1], scope);
        if (lname === 'checked'){ el._dcChecked = !!v; if (v) el.setAttribute('checked', ''); continue; }
        if (v === false || v == null) continue;
        el.setAttribute(name, v === true ? '' : String(v)); continue;
      }
      if (val.indexOf('{{') >= 0) val = val.replace(HOLE, function(_, p){ var x = look(p, scope); return x == null ? '' : String(x); });
      el.setAttribute(name, val);
    }
    kids(node, scope, ns).forEach(function(c){ el.appendChild(c); });
    return [el];
  }
  function kids(node, scope, ns){ var out = []; var src = node.content || node; for (var c = src.firstChild; c; c = c.nextSibling) out.push.apply(out, renderNodes(c, scope, ns)); return out; }
  function morph(from, to){
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){ from.parentNode.replaceChild(to, from); return; }
    if (from.nodeType === 3){ if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    var i;
    for (i = from.attributes.length - 1; i >= 0; i--){ var n = from.attributes[i].name; if (!to.hasAttribute(n)) from.removeAttribute(n); }
    for (i = 0; i < to.attributes.length; i++){ var at = to.attributes[i]; if (from.getAttribute(at.name) !== at.value) from.setAttribute(at.name, at.value); }
    from._dcH = to._dcH;
    if (to._dcChecked !== undefined){ from.checked = to._dcChecked; }
    patchChildren(from, Array.prototype.slice.call(to.childNodes));
  }
  function patchChildren(parent, next){
    var cur = Array.prototype.slice.call(parent.childNodes), i;
    for (i = 0; i < next.length; i++){ if (i < cur.length) morph(cur[i], next[i]); else parent.appendChild(next[i]); }
    for (i = next.length; i < cur.length; i++) parent.removeChild(cur[i]);
  }
  window.mountDC = function(root, tpl, Component){
    var comp = new Component({});
    comp._render = function(){ var vals = comp.renderVals ? comp.renderVals() : {}; patchChildren(root, kids(tpl, vals)); };
    ['click', 'submit', 'change', 'input'].forEach(function(type){
      root.addEventListener(type, function(e){
        for (var el = e.target; el && el !== root.parentNode; el = el.parentNode){ if (el._dcH && el._dcH[type]){ el._dcH[type](e); break; } }
      });
    });
    comp._render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, done: false }; }
  renderVals() {
    const s = this.state;
    const data = [
      { label: 'Education', body: 'Helping students access schooling, learning materials and skills training — especially in rural communities.', plan: '[Scholarships, school supplies, digital-skills workshops]', img: 'images/eco-foundation.svg' },
      { label: 'Healthcare', body: 'Supporting access to basic healthcare for people and communities who struggle to reach it.', plan: '[Health camps, partnerships with local clinics]', img: 'images/impact.svg' },
      { label: 'Essential support', body: 'Providing essential support to families facing hardship or emergencies.', plan: '[Emergency relief, essentials drives]', img: 'images/nepal.svg' },
      { label: 'Opportunity', body: 'Creating pathways to work and entrepreneurship through free education and mentoring.', plan: '[Entrepreneurship bootcamps, Build Your Brand scholarships]', img: 'images/eco-business.svg' },
      { label: 'Community', body: 'Strengthening communities by bringing people, partners and resources together.', plan: '[Community events, volunteer network]', img: 'images/global.svg' }
    ];
    const pillars = data.map((p, k) => ({ label: p.label, selected: k === s.i ? 'true' : 'false', bg: k === s.i ? '#E9A23B' : 'transparent', fg: k === s.i ? '#111111' : '#FFFFFF', border: k === s.i ? '#E9A23B' : '#3A3833', pick: () => this.setState({ i: k }) }));
    return {
      pillars, cur: data[s.i],
      formOpen: !s.done, formDone: s.done,
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ done: true }); }
    };
  }
}
mountDC(document.getElementById('app'), document.getElementById('page'), Component);
</script>
</body>
</html>
